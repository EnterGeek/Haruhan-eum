name: Nightly stress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-stress
  cancel-in-progress: true

jobs:
  deterministic-deck-stress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate 10,000 deterministic decks
        env:
          HARUHAN_STRESS: '1'
        run: npm test
      - name: Build all entry points
        run: npm run build
