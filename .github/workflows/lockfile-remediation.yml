name: One-time lockfile remediation

on:
  push:
    branches: [chore/public-baseline-cleanup]
    paths:
      - .github/workflows/lockfile-remediation.yml

permissions:
  contents: write

concurrency:
  group: one-time-lockfile-remediation
  cancel-in-progress: true

jobs:
  remediate:
    if: github.repository_owner == 'EnterGeek'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: chore/public-baseline-cleanup
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install current lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply audit-compatible lockfile updates
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify no high or critical advisories remain
        run: npm audit --audit-level=high
      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: remediate dependency lockfile"
          git push origin HEAD:chore/public-baseline-cleanup
